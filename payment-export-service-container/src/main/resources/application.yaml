payment-export:
  create-job:
    max-date-range-days: ${PAYMENT_EXPORT_MAX_DATE_RANGE_DAYS:31}
  soap:
    get-batch:
      uri: ${PAYMENT_EXPORT_GET_BATCH_SOAP_URI:http://localhost:6060/ws}
    get-transactions:
      uri: ${PAYMENT_EXPORT_GET_TRANSACTIONS_SOAP_URI:http://localhost:7070/ws}
  scheduler:
    get-batch:
      fixed-delay: ${PAYMENT_EXPORT_GET_BATCH_SCHEDULER_DELAY:60000}
      max-jobs-per-run: ${PAYMENT_EXPORT_GET_BATCH_MAX_JOBS_PER_RUN:10}
      page-size: ${PAYMENT_EXPORT_GET_BATCH_PAGE_SIZE:100}
      max-job-retry-attempts: ${PAYMENT_EXPORT_GET_BATCH_MAX_JOB_RETRY_ATTEMPTS:5}
      soap-call-retry-attempts: ${PAYMENT_EXPORT_GET_BATCH_SOAP_CALL_RETRY_ATTEMPTS:3}
      initial-retry-backoff: ${PAYMENT_EXPORT_GET_BATCH_INITIAL_RETRY_BACKOFF:PT1S}
      retry-backoff-multiplier: ${PAYMENT_EXPORT_GET_BATCH_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-retry-backoff: ${PAYMENT_EXPORT_GET_BATCH_MAX_RETRY_BACKOFF:PT10S}
      stale-fetch-timeout: ${PAYMENT_EXPORT_GET_BATCH_STALE_FETCH_TIMEOUT:PT15M}
    get-transactions:
      fixed-delay: ${PAYMENT_EXPORT_GET_TRANSACTIONS_SCHEDULER_DELAY:60000}
      max-batches-per-run: ${PAYMENT_EXPORT_GET_TRANSACTIONS_MAX_BATCHES_PER_RUN:10}
      page-size: ${PAYMENT_EXPORT_GET_TRANSACTIONS_PAGE_SIZE:100}
      soap-call-retry-attempts: ${PAYMENT_EXPORT_GET_TRANSACTIONS_SOAP_CALL_RETRY_ATTEMPTS:3}
      initial-retry-backoff: ${PAYMENT_EXPORT_GET_TRANSACTIONS_INITIAL_RETRY_BACKOFF:PT1S}
      retry-backoff-multiplier: ${PAYMENT_EXPORT_GET_TRANSACTIONS_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-retry-backoff: ${PAYMENT_EXPORT_GET_TRANSACTIONS_MAX_RETRY_BACKOFF:PT10S}
      stale-processing-timeout: ${PAYMENT_EXPORT_GET_TRANSACTIONS_STALE_PROCESSING_TIMEOUT:PT15M}
    csv-generation:
      fixed-delay: ${PAYMENT_EXPORT_CSV_GENERATION_SCHEDULER_DELAY:60000}
      max-jobs-per-run: ${PAYMENT_EXPORT_CSV_GENERATION_MAX_JOBS_PER_RUN:5}
      max-total-rows-per-run: ${PAYMENT_EXPORT_CSV_GENERATION_MAX_TOTAL_ROWS_PER_RUN:1000000}
      max-job-retry-attempts: ${PAYMENT_EXPORT_CSV_GENERATION_MAX_JOB_RETRY_ATTEMPTS:5}
      generation-retry-attempts: ${PAYMENT_EXPORT_CSV_GENERATION_RETRY_ATTEMPTS:2}
      initial-retry-backoff: ${PAYMENT_EXPORT_CSV_GENERATION_INITIAL_RETRY_BACKOFF:PT1S}
      retry-backoff-multiplier: ${PAYMENT_EXPORT_CSV_GENERATION_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-retry-backoff: ${PAYMENT_EXPORT_CSV_GENERATION_MAX_RETRY_BACKOFF:PT15S}
      stale-generation-timeout: ${PAYMENT_EXPORT_CSV_GENERATION_STALE_TIMEOUT:PT30M}
    cleanup:
      fixed-delay: ${PAYMENT_EXPORT_CLEANUP_SCHEDULER_DELAY:3600000}
      max-jobs-per-run: ${PAYMENT_EXPORT_CLEANUP_MAX_JOBS_PER_RUN:50}
      max-batches-per-run: ${PAYMENT_EXPORT_CLEANUP_MAX_BATCHES_PER_RUN:200}
      max-transactions-per-run: ${PAYMENT_EXPORT_CLEANUP_MAX_TRANSACTIONS_PER_RUN:500}
      retention-period: ${PAYMENT_EXPORT_CLEANUP_RETENTION_PERIOD:P5D}
  storage:
    s3:
      bucket-name: ${PAYMENT_EXPORT_S3_BUCKET_NAME:payment-export-files}
      region: ${PAYMENT_EXPORT_S3_REGION:eu-west-1}
      endpoint: ${PAYMENT_EXPORT_S3_ENDPOINT:}
      access-key-id: ${PAYMENT_EXPORT_S3_ACCESS_KEY_ID:}
      secret-access-key: ${PAYMENT_EXPORT_S3_SECRET_ACCESS_KEY:}
      session-token: ${PAYMENT_EXPORT_S3_SESSION_TOKEN:}
      signing-enabled: ${PAYMENT_EXPORT_S3_SIGNING_ENABLED:true}
      object-key-prefix: ${PAYMENT_EXPORT_S3_OBJECT_KEY_PREFIX:exports}

security:
  jwt:
    signature-verification-url: ${PAYMENT_EXPORT_JWT_VERIFY_URL:http://localhost:5050/stub/jwt/verify-signature}
    signature-verification-timeout: ${PAYMENT_EXPORT_JWT_VERIFY_TIMEOUT:5s}

spring:
  application:
    name: payment-export-service-web
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:payment_export_service_db}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
    default-schema: public
    schemas: public
    create-schemas: true